<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Actividad</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .contenedor { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .error-msg { color: red; font-size: 0.9em; display: none; margin-bottom: 10px; }
        .comentario-box { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .fecha { color: #666; font-size: 0.8em; }
        .form-group { margin-bottom: 15px; }
        input[type="text"], textarea { width: 100%; box-sizing: border-box; }
        .btn { padding: 10px 15px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px;}
        .btn:hover { background: #218838; }
        .volver { display: inline-block; margin-top: 20px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

<div class="contenedor">
    <h1>Información de la Actividad</h1>
    <p><strong>Nombre:</strong> {{ actividad.nombre_actividad }}</p>
    <p><strong>Tipo:</strong> {{ actividad.tipo_actividad }}</p>
    <p><strong>Horario:</strong> {{ actividad.horario }}</p>
    <p><strong>Lugar:</strong> {{ actividad.lugar }}</p>
    
    <hr>

    <h3>Agregar Comentario</h3>
    <form id="formComentario">
        <div class="form-group">
            <label>Nombre del comentarista (Obligatorio):</label><br>
            <input type="text" id="nombre" minlength="3" maxlength="80" required>
            <div id="error-nombre" class="error-msg"></div>
        </div>

        <div class="form-group">
            <label>Comentario (Obligatorio):</label><br>
            <textarea id="texto" rows="4" cols="50" minlength="5" required></textarea>
            <div id="error-texto" class="error-msg"></div>
        </div>

        <button type="submit" class="btn">Agregar comentario</button>
    </form>

    <hr>

    <h3>Listado de Comentarios</h3>
    <div id="lista-comentarios">
    </div>

    <a href="{{ url_for('listado_actividades') }}" class="volver">Volver al listado</a>
</div>

<script>
    const idActividad = parseInt("{{ actividad.id }}");
    const listaComentariosDiv = document.getElementById('lista-comentarios');
    const formComentario = document.getElementById('formComentario');

    // obtener comentarios
    function cargarComentarios() {
        fetch(`/api/actividad/${idActividad}/comentarios`)
            .then(response => response.json())
            .then(data => {
                listaComentariosDiv.innerHTML = ''; 
                if (data.length === 0) {
                    listaComentariosDiv.innerHTML = '<p>No hay comentarios aún.</p>';
                    return;
                }
                
                // recorremos y armamos la lista
                data.forEach(c => {
                    listaComentariosDiv.innerHTML += `
                        <div class="comentario-box">
                            <strong>${c.nombre}</strong> <span class="fecha">(${c.fecha})</span>
                            <p style="margin: 5px 0;">${c.texto}</p>
                        </div>
                    `;
                });
            })
            .catch(error => console.error('Error:', error));
    }

    formComentario.addEventListener('submit', function(e) {
        e.preventDefault();

        document.getElementById('error-nombre').style.display = 'none';
        document.getElementById('error-texto').style.display = 'none';

        const nombre = document.getElementById('nombre').value;
        const texto = document.getElementById('texto').value;

        // validación
        let errores = false;
        if(nombre.length < 3 || nombre.length > 80) {
            document.getElementById('error-nombre').innerText = "El nombre debe tener entre 3 y 80 caracteres.";
            document.getElementById('error-nombre').style.display = 'block';
            errores = true;
        }
        if(texto.length < 5) {
            document.getElementById('error-texto').innerText = "El comentario debe tener al menos 5 caracteres.";
            document.getElementById('error-texto').style.display = 'block';
            errores = true;
        }
        // si hay error, no enviamos
        if(errores) return; 

        // enviar al servidor
        fetch(`/api/actividad/${idActividad}/comentarios`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre: nombre, texto: texto })
        })
        .then(response => response.json().then(data => ({status: response.status, body: data})))
        .then(res => {
            if (res.status === 400) {
                // validación
                if (res.body.errores.nombre) {
                    document.getElementById('error-nombre').innerText = res.body.errores.nombre;
                    document.getElementById('error-nombre').style.display = 'block';
                }
                if (res.body.errores.texto) {
                    document.getElementById('error-texto').innerText = res.body.errores.texto;
                    document.getElementById('error-texto').style.display = 'block';
                }
            } else if (res.status === 201) {
                // todo bien 
                formComentario.reset();
                cargarComentarios();
            }
        })
        .catch(error => console.error('Error al enviar:', error));
    });

    cargarComentarios();
</script>

</body>
</html>
