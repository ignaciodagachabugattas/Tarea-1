spring.application.name=actividades
# conexi\u00f3n a la base de datos mysql
spring.datasource.url=jdbc:mysql://localhost:3306/tarea2
spring.datasource.username=cc5002
spring.datasource.password=programacionweb

# le decimos a hibernate (jpa) que no borre ni sobreescriba tus tablas existentes
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Puerto donde correr\u00e1 el backend de Spring Boot
server.port=8080

# Configuraci\u00f3n de conexi\u00f3n a tu base de datos MySQL 'tarea2'
spring.datasource.url=jdbc:mysql://localhost:3306/tarea2?useSSL=false&serverTimezone=UTC
spring.datasource.username=cc5002
spring.datasource.password=programacionweb
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci\u00f3n de Hibernate (El equivalente a SQLAlchemy en Java)
# 'update' mantiene tus tablas existentes y solo agrega columnas nuevas si es necesario
spring.jpa.hibernate.ddl-auto=update
# Esto imprimir\u00e1 en la consola las consultas SQL que Java hace por debajo (ideal para depurar)
spring.jpa.show-sql=true